<div style="animation: fadeIn 0.3s ease;">

  <!-- ADMIN: TOP CONTROLS -->
  <div *ngIf="api.userRole.value === 'admin'" style="display: flex; justify-content: flex-end; margin-bottom: 30px;">
    <button (click)="goToCreateTournament()" style="background: #00d28a; color: #0b0f19; border: none; padding: 14px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 15px; box-shadow: 0 8px 20px rgba(0, 210, 138, 0.25); display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 18px;">+</span> Create New Tournament
    </button>
  </div>

  <!-- ACTIVE TOURNAMENTS SECTION -->
  <div style="background: #151a27; padding: 40px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.02); margin-bottom: 40px;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 20px;">
      <h2 style="margin: 0; font-size: 20px; color: #fff; font-weight: 700;">Active Tournaments</h2>
      
      <div style="display: flex; background: #0b0f19; border-radius: 12px; padding: 6px;">
        <button (click)="tournamentView = 'all'" [style.background]="tournamentView === 'all' ? '#1c2333' : 'transparent'" [style.color]="tournamentView === 'all' ? '#fff' : '#64748b'" style="border: none; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s;">All Tournaments</button>
        <button (click)="tournamentView = 'my'" [style.background]="tournamentView === 'my' ? '#1c2333' : 'transparent'" [style.color]="tournamentView === 'my' ? '#fff' : '#64748b'" style="border: none; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s;">My Tournaments</button>
      </div>
    </div>

    <!-- Filters & Search Toolbar -->
    <div style="display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap;">
      <input type="text" [(ngModel)]="searchQuery" placeholder="Search tournaments..." style="flex: 2; padding: 12px 16px; background: rgba(255,255,255,0.03); border: 1px solid transparent; color: #fff; border-radius: 12px; font-size: 14px; outline: none;">
      
      <select [(ngModel)]="selectedGame" 
              [style.color]="selectedGame === 'Valorant' ? '#ff4655' : (selectedGame === 'CS2' ? '#eab308' : '#fff')"
              style="padding: 12px 40px 12px 16px; background-color: rgba(255,255,255,0.03); background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E'); background-repeat: no-repeat; background-position: right 14px center; background-size: 12px auto; border: 1px solid transparent; border-radius: 12px; font-size: 14px; outline: none; appearance: none; font-weight: 600; cursor: pointer; transition: color 0.2s;">
        <option value="ALL" style="color: #fff;">All</option>
        <option value="Valorant" style="color: #ff4655;">Valorant</option>
        <option value="CS2" style="color: #eab308;">CS2</option>
      </select>

      <select [(ngModel)]="selectedStatus" 
              [style.color]="selectedStatus === 'ALL' ? '#94a3b8' : (selectedStatus === 'REGISTRATION_OPEN' ? '#38bdf8' : (selectedStatus === 'ONGOING' ? '#10b981' : '#64748b'))"
              style="padding: 12px 40px 12px 16px; background-color: rgba(255,255,255,0.03); background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E'); background-repeat: no-repeat; background-position: right 14px center; background-size: 12px auto; border: 1px solid transparent; border-radius: 12px; font-size: 14px; outline: none; appearance: none; font-weight: 600; cursor: pointer; transition: color 0.2s;">
        <option value="ALL" style="color: #fff;">Status</option>
        <option value="REGISTRATION_OPEN" style="color: #38bdf8;">Registration Open</option>
        <option value="ONGOING" style="color: #10b981;">Ongoing</option>
      </select>
    </div>

    <!-- Loading State Indicator -->
    <div *ngIf="isLoadingTournaments" style="text-align: center; padding: 40px; color: #64748b; font-weight: 600;">
      Loading tournaments...
    </div>

    <div *ngIf="!isLoadingTournaments && activeFilteredTournaments.length === 0" style="text-align: center; padding: 40px; color: #64748b; font-size: 14px;">
      No active tournaments found.
    </div>

    <!-- Active Tournaments Grid -->
    <div *ngIf="!isLoadingTournaments" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; align-items: start;">
      <div *ngFor="let t of activeFilteredTournaments; trackBy: trackByTourney">
        
        <div (click)="goToTournament(t.tournament_id)" 
             [style.border-left]="'4px solid ' + (t.status === 'REGISTRATION_OPEN' ? '#38bdf8' : '#10b981')"
             style="display: flex; flex-direction: column; justify-content: space-between; background: rgba(255,255,255,0.02); padding: 25px; border-radius: 16px; border-top: 1px solid rgba(255,255,255,0.03); border-right: 1px solid rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer; transition: transform 0.2s, background 0.2s; min-height: 120px;">
          <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
              <span [style.color]="t.status === 'REGISTRATION_OPEN' ? '#38bdf8' : '#10b981'" [style.background]="t.status === 'REGISTRATION_OPEN' ? 'rgba(56, 189, 248, 0.1)' : 'rgba(16, 185, 129, 0.1)'" style="font-size: 10px; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;">{{ t.status }}</span>
              <span style="font-size: 12px; color: #64748b; font-weight: 500;">ID #{{ t.tournament_id }}</span>
            </div>
            <h3 style="margin: 0 0 6px 0; font-size: 18px; color: #fff; font-weight: 700;">{{ t.name }}</h3>
            <p style="margin: 0; font-size: 13px; font-weight: 600;" [style.color]="t.game_title === 'Valorant' ? '#ff4655' : (t.game_title === 'CS2' ? '#eab308' : '#94a3b8')">🎮 {{ t.game_title }}</p>
          </div>

          <div style="display: flex; justify-content: flex-end; align-items: center; margin-top: 20px;">
            <button *ngIf="api.userRole.value === 'admin'" (click)="deleteTournament(t.tournament_id, $event)" style="background: transparent; border: 1px solid rgba(244, 63, 94, 0.5); color: #f43f5e; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; margin-right: auto;">Delete</button>
            <div style="color: #38bdf8; font-size: 13px; font-weight: 600;">View Tournament →</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- COMPLETED TOURNAMENTS SECTION -->
  <div *ngIf="completedFilteredTournaments.length > 0" style="background: #151a27; padding: 40px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.02);">
    <h2 style="margin: 0 0 30px 0; font-size: 20px; color: #fff; font-weight: 700;">Completed Tournaments</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; align-items: start;">
      <div *ngFor="let t of completedFilteredTournaments; trackBy: trackByTourney">
        <div (click)="goToTournament(t.tournament_id)" style="display: flex; flex-direction: column; justify-content: space-between; background: rgba(255,255,255,0.02); padding: 25px; border-radius: 16px; border-left: 4px solid #64748b; border-top: 1px solid rgba(255,255,255,0.03); border-right: 1px solid rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer; transition: transform 0.2s, background 0.2s; min-height: 120px;">
          <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
              <span style="font-size: 10px; background: rgba(100, 116, 139, 0.1); color: #64748b; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;">COMPLETED</span>
              <span style="font-size: 12px; color: #64748b; font-weight: 500;">ID #{{ t.tournament_id }}</span>
            </div>
            <h3 style="margin: 0 0 6px 0; font-size: 18px; color: #fff; font-weight: 700;">{{ t.name }}</h3>
            <p style="margin: 0; font-size: 13px; font-weight: 600;" [style.color]="t.game_title === 'Valorant' ? '#ff4655' : '#eab308'">🎮 {{ t.game_title }}</p>
          </div>
          <div style="display: flex; justify-content: flex-end; align-items: center; margin-top: 20px;">
            <button *ngIf="api.userRole.value === 'admin'" (click)="deleteTournament(t.tournament_id, $event)" style="background: transparent; border: 1px solid rgba(244, 63, 94, 0.5); color: #f43f5e; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; margin-right: auto;">Delete</button>
            <div style="color: #64748b; font-size: 13px; font-weight: 600;">View Tournament →</div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
