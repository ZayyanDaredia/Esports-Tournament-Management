<div style="max-width: 400px; margin: 100px auto; background: #151a27; padding: 40px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.03); animation: fadeIn 0.3s ease;">
  <h2 style="text-align: center; margin: 0 0 30px 0; color: #fff; font-size: 24px; font-weight: 700;">{{ authMode === 'login' ? 'Welcome Back' : 'Create Account' }}</h2>
  
  <form (submit)="$event.preventDefault()">
    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 8px; font-size: 12px; color: #64748b; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px;">Username</label>
      <input type="text" #userInput style="width: 100%; padding: 14px 18px; background: #1c2333; border: 1px solid transparent; color: #fff; border-radius: 12px; box-sizing: border-box; font-size: 15px; outline: none;">
    </div>

    <div style="margin-bottom: 30px;">
      <label style="display: block; margin-bottom: 8px; font-size: 12px; color: #64748b; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px;">Password</label>
      <input type="password" #passInput style="width: 100%; padding: 14px 18px; background: #1c2333; border: 1px solid transparent; color: #fff; border-radius: 12px; box-sizing: border-box; font-size: 15px; outline: none;">
    </div>

    <button *ngIf="authMode === 'login'" (click)="login(userInput.value, passInput.value)" style="width: 100%; background: #f43f5e; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 15px; box-shadow: 0 8px 20px rgba(244, 63, 94, 0.25);">Sign In</button>
    <button *ngIf="authMode === 'signup'" (click)="signup(userInput.value, passInput.value)" style="width: 100%; background: #00d28a; color: #0b0f19; border: none; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 15px; box-shadow: 0 8px 20px rgba(0, 210, 138, 0.25);">Create Account</button>
  </form>

  <p style="text-align: center; margin-top: 25px; font-size: 14px; color: #64748b;">
    <span *ngIf="authMode === 'login'">New here? <a (click)="authMode = 'signup'" style="color: #38bdf8; cursor: pointer; font-weight: 600;">Sign up</a></span>
    <span *ngIf="authMode === 'signup'">Have an account? <a (click)="authMode = 'login'" style="color: #38bdf8; cursor: pointer; font-weight: 600;">Login</a></span>
  </p>
</div>
